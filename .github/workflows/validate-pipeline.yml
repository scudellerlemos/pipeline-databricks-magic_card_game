name: CI/CD Pipeline - Magic Card Game

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - '.github/DAGs/**'
      - '.github/workflows/**'
      - '.github/scripts/**'
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - '.github/DAGs/**'
      - '.github/workflows/**'
      - '.github/scripts/**'

jobs:
  # ============================================================================
  # VALIDAÇÕES DURANTE PR
  # ============================================================================
  validate:
    runs-on: ubuntu-latest
    environment: Databricks
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      checks: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        pip install pyyaml jsonschema databricks-cli ruff pytest

    - name: Validate YAML syntax
      run: |
        python -c "import yaml; yaml.safe_load(open('.github/DAGs/magic.yml', 'r'))"
        echo "✅ YAML syntax is valid"
        
    - name: Validate pipeline structure
      run: |
        python -c "
        import yaml
        import sys
        
        with open('.github/DAGs/magic.yml', 'r') as f:
            config = yaml.safe_load(f)
        
        # Check if jobs exist
        if 'resources' not in config or 'jobs' not in config['resources']:
            print('❌ No jobs found in configuration')
            sys.exit(1)
            
        # Check if MTG_PIPELINE exists
        if 'MTG_PIPELINE' not in config['resources']['jobs']:
            print('❌ MTG_PIPELINE job not found')
            sys.exit(1)
            
        job = config['resources']['jobs']['MTG_PIPELINE']
        
        # Check required fields
        required_fields = ['name', 'tasks', 'job_clusters', 'git_source']
        for field in required_fields:
            if field not in job:
                print(f'❌ Missing required field: {field}')
                sys.exit(1)
                
        # Check if tasks exist
        if not job['tasks']:
            print('❌ No tasks defined')
            sys.exit(1)
            
        # Check task dependencies
        task_keys = [task['task_key'] for task in job['tasks']]
        for task in job['tasks']:
            if 'depends_on' in task:
                for dep in task['depends_on']:
                    if dep['task_key'] not in task_keys:
                        print(f'❌ Task {task[\"task_key\"]} depends on non-existent task: {dep[\"task_key\"]}')
                        sys.exit(1)
                        
        print('✅ Pipeline structure is valid')
        print(f'📊 Total tasks: {len(job[\"tasks\"])}')
        "
        
    - name: Check notebook paths
      run: |
        python -c "
        import yaml
        import os
        import sys
        
        with open('.github/DAGs/magic.yml', 'r') as f:
            config = yaml.safe_load(f)
            
        job = config['resources']['jobs']['MTG_PIPELINE']
        
        missing_notebooks = []
        for task in job['tasks']:
            if 'notebook_task' in task:
                notebook_path = task['notebook_task']['notebook_path']
                # Remove .ipynb extension if present
                if notebook_path.endswith('.ipynb'):
                    notebook_path = notebook_path[:-6]

                # Notebook pode estar em .ipynb (legado) ou .py (Databricks source format)
                if not os.path.exists(f'{notebook_path}.ipynb') and not os.path.exists(f'{notebook_path}.py'):
                    missing_notebooks.append(f'{notebook_path}.ipynb|.py')

        if missing_notebooks:
            print('❌ Missing notebooks:')
            for notebook in missing_notebooks:
                print(f'  - {notebook}')
            sys.exit(1)
                    
        print('✅ All notebook paths are valid')
        "
        
    - name: Validate cluster configuration
      run: |
        python -c "
        import yaml
        import sys
        
        with open('.github/DAGs/magic.yml', 'r') as f:
            config = yaml.safe_load(f)
            
        job = config['resources']['jobs']['MTG_PIPELINE']
        
        # Check cluster configuration
        if 'job_clusters' not in job:
            print('❌ No job clusters defined')
            sys.exit(1)
            
        for cluster in job['job_clusters']:
            if 'new_cluster' not in cluster:
                print('❌ Cluster configuration missing new_cluster section')
                sys.exit(1)
                
            cluster_config = cluster['new_cluster']
            required_cluster_fields = ['spark_version', 'node_type_id']
            
            for field in required_cluster_fields:
                if field not in cluster_config:
                    print(f'❌ Missing required cluster field: {field}')
                    sys.exit(1)
                    
        print('✅ Cluster configuration is valid')
        "
        
    - name: Check git configuration
      run: |
        python -c "
        import yaml
        import sys
        
        with open('.github/DAGs/magic.yml', 'r') as f:
            config = yaml.safe_load(f)
            
        job = config['resources']['jobs']['MTG_PIPELINE']
        
        if 'git_source' not in job:
            print('❌ Git source not configured')
            sys.exit(1)
            
        git_config = job['git_source']
        required_git_fields = ['git_url', 'git_provider', 'git_branch']
        
        for field in required_git_fields:
            if field not in git_config:
                print(f'❌ Missing required git field: {field}')
                sys.exit(1)
                
        print('✅ Git configuration is valid')
        "
        
    - name: Validate notebook syntax
      run: |
        python -c "
        import yaml
        import json
        import os
        import sys
        
        with open('.github/DAGs/magic.yml', 'r') as f:
            config = yaml.safe_load(f)
            
        job = config['resources']['jobs']['MTG_PIPELINE']
        
        invalid_notebooks = []
        for task in job['tasks']:
            if 'notebook_task' in task:
                notebook_path = task['notebook_task']['notebook_path']
                if notebook_path.endswith('.ipynb'):
                    notebook_path = notebook_path[:-6]

                ipynb_file = f'{notebook_path}.ipynb'
                py_file = f'{notebook_path}.py'

                if os.path.exists(py_file):
                    # Databricks source format: precisa do header e de pelo
                    # menos 1 comando (nao ha JSON pra validar aqui)
                    with open(py_file, 'r', encoding='utf-8') as f:
                        first_line = f.readline().strip()
                    if first_line != '# Databricks notebook source':
                        invalid_notebooks.append(f'{py_file} - Missing \"# Databricks notebook source\" header')
                    continue

                notebook_file = ipynb_file
                try:
                    with open(notebook_file, 'r') as f:
                        notebook_data = json.load(f)

                    # Check if notebook has cells
                    if 'cells' not in notebook_data:
                        invalid_notebooks.append(f'{notebook_file} - No cells found')
                        continue

                    # Check if notebook has at least one code cell
                    code_cells = [cell for cell in notebook_data['cells'] if cell.get('cell_type') == 'code']
                    if not code_cells:
                        invalid_notebooks.append(f'{notebook_file} - No code cells found')

                except json.JSONDecodeError:
                    invalid_notebooks.append(f'{notebook_file} - Invalid JSON')
                except Exception as e:
                    invalid_notebooks.append(f'{notebook_file} - {str(e)}')
                    
        if invalid_notebooks:
            print('❌ Invalid notebooks:')
            for notebook in invalid_notebooks:
                print(f'  - {notebook}')
            sys.exit(1)
                    
        print('✅ All notebook syntax is valid')
        "

    - name: Lint notebook Python cells (AUD-10)
      run: |
        python .github/scripts/lint_notebooks.py

    - name: Run unit tests (AUD-11)
      run: |
        python -m pytest src -q

    - name: Generate validation report
      run: |
        python -c "
        import yaml
        from datetime import datetime
        
        with open('.github/DAGs/magic.yml', 'r') as f:
            config = yaml.safe_load(f)
            
        job = config['resources']['jobs']['MTG_PIPELINE']
        
        print('📋 Pipeline Validation Report')
        print('=' * 50)
        print(f'Job Name: {job[\"name\"]}')
        print(f'Description: {job[\"description\"]}')
        print(f'Total Tasks: {len(job[\"tasks\"])}')
        print(f'Schedule: {job[\"schedule\"][\"quartz_cron_expression\"]}')
        print(f'Timezone: {job[\"schedule\"][\"timezone_id\"]}')
        print(f'Status: {job[\"schedule\"][\"pause_status\"]}')
        print()
        
        print('📁 Task Breakdown:')
        task_types = {}
        for task in job['tasks']:
            task_type = task['task_key'].split('_')[0]
            task_types[task_type] = task_types.get(task_type, 0) + 1
            
        for task_type, count in task_types.items():
            print(f'  {task_type}: {count} tasks')
            
        print()
        print('🔗 Dependencies:')
        for task in job['tasks']:
            if 'depends_on' in task:
                deps = [dep['task_key'] for dep in task['depends_on']]
                print(f'  {task[\"task_key\"]} → {deps}')
                
        print()
        print('✅ Validation completed successfully!')
        print(f'📅 Generated: {datetime.now().strftime(\"%Y-%m-%d %H:%M:%S\")}')
        "
        
    - name: Comment PR with validation results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const comment = `## ✅ Validação do Pipeline Concluída
          
          ### 📊 Resumo da Validação:
          - ✅ Sintaxe YAML válida
          - ✅ Estrutura do pipeline válida
          - ✅ Caminhos dos notebooks verificados
          - ✅ Configuração do cluster válida
          - ✅ Configuração Git válida
          - ✅ Sintaxe dos notebooks válida
          - ✅ Lint estático das células Python (referências indefinidas)
          - ✅ Suíte de testes unitários (pytest)

          🚀 **Pipeline pronto para deploy!**
          
          ---
          *Validação executada em: ${new Date().toLocaleString('pt-BR')}*`;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

  # ============================================================================
  # DEPLOY AUTOMÁTICO APÓS APROVAÇÃO DA PR
  # ============================================================================
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: Databricks
    permissions:
      contents: read

    # Só executa quando a PR é aprovada e mergeada na main
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        pip install databricks-cli pyyaml
        
    - name: Configure Databricks CLI
      run: |
        echo "DATABRICKS_HOST=$DATABRICKS_HOST" >> $GITHUB_ENV
        echo "DATABRICKS_TOKEN=$DATABRICKS_TOKEN" >> $GITHUB_ENV
        
    - name: Validate Databricks connection
      run: |
        databricks --version
        # Test connection without requiring specific output format
        databricks jobs list || echo "Connection test completed"
        
    - name: Deploy to Databricks
      run: |
        echo "🚀 Iniciando deploy do pipeline..."
        python .github/scripts/deploy.py
        
    - name: Verify deployment
      run: |
        echo "⏳ Aguardando 30 segundos para verificar o deploy..."
        sleep 30
        
        echo "🔍 Verificando status do job..."
        # Use simple text output for compatibility with old CLI
        databricks jobs list | grep "MTG_PIPELINE" || echo "Job verification completed"
        
        # Simple verification
        if databricks jobs list | grep -q "MTG_PIPELINE"; then
          echo "✅ Job encontrado e configurado corretamente"
        else
          echo "⚠️ Job não encontrado na listagem (pode ser normal se for a primeira execução)"
        fi
        
    - name: Create deployment summary
      run: |
        echo "## 🚀 Deploy Concluído com Sucesso!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📋 Detalhes do Deploy:" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Pipeline validado" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Conexão com Databricks estabelecida" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Job criado/atualizado no Databricks" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Verificação de status concluída" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "🎉 **Pipeline em produção!**" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "📅 Deploy realizado em: $(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_STEP_SUMMARY
        
    - name: Deploy success notification
      if: github.event_name == 'push'
      run: |
        echo "🎉 Deploy realizado com sucesso!"
        echo "📍 Ambiente: Databricks Production"
        echo "🔗 Host: $DATABRICKS_HOST"
        echo "📅 Data: $(date '+%Y-%m-%d %H:%M:%S')"
        echo "✅ Pipeline MTG_PIPELINE atualizado e funcional"
