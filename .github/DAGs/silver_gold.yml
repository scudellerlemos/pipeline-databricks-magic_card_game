resources:
  jobs:
    # Silver/Gold ficam como estavam (mesmas tasks, mesmas dependencias
    # internas) - so viraram um job proprio, acionado pelo orquestrador
    # (pipeline.yml) depois que MTG_BRONZE termina inteira. Por isso
    # perderam o depends_on em bronze_cartas/bronze_colecao: essas tasks
    # nao existem mais neste job, e a ordem ja e garantida por fora.
    MTG_SILVER_GOLD:
      name: MTG_SILVER_GOLD
      description: "Camadas Silver e Gold do pipeline de Magic: The Gathering"
      tasks:
        # ============================================================================
        # SILVER LAYER
        # ============================================================================
        - task_key: silver_cartas
          notebook_task:
            notebook_path: src/03 - Silver/Dev/TB_FATO_CARTAS
            source: GIT
          job_cluster_key: Job_cluster

        - task_key: silver_colecao
          notebook_task:
            notebook_path: src/03 - Silver/Dev/TB_DIM_COLECOES
            source: GIT
          job_cluster_key: Job_cluster

        - task_key: silver_precos
          notebook_task:
            notebook_path: src/03 - Silver/Dev/TB_FATO_PRECOS_CARTAS
            source: GIT
          job_cluster_key: Job_cluster

        - task_key: silver_migracoes
          notebook_task:
            notebook_path: src/03 - Silver/Dev/TB_MOV_MIGRACOES_CARTAS
            source: GIT
          job_cluster_key: Job_cluster

        - task_key: silver_simbolos
          notebook_task:
            notebook_path: src/03 - Silver/Dev/TB_DOM_SIMBOLOS
            source: GIT
          job_cluster_key: Job_cluster

        - task_key: silver_esclarecimentos
          notebook_task:
            notebook_path: src/03 - Silver/Dev/TB_FATO_ESCLARECIMENTOS_CARTAS
            source: GIT
          job_cluster_key: Job_cluster

        # ============================================================================
        # GOLD LAYER
        # ============================================================================
        # Camada Gold removida pra reconstrução (scripts antigos apontavam pra
        # colunas em ingles que nao existem mais na Silver pos-renomeacao
        # DAMA/#115/#116) - tasks gold_* voltam aqui quando os notebooks forem
        # reescritos contra o schema atual.

      job_clusters:
        - job_cluster_key: Job_cluster
          new_cluster:
            spark_version: "14.3.x-scala2.12"
            node_type_id: "m5d.large"
            # Autoscale em vez de num_workers fixo - mesmo fix ja validado na
            # Stage (commit 6fb218c): 1 worker fixo com varias tasks
            # concorrentes deu OOM la, autoscale absorve o pico sem exigir
            # depends_on artificial entre tasks sem dependencia de dado real.
            autoscale:
              min_workers: 1
              max_workers: 2
            aws_attributes:
              first_on_demand: 1
              zone_id: "us-west-1a"
              spot_bid_price_percent: 100
            spark_env_vars:
              PYSPARK_PYTHON: "/databricks/python3/bin/python3"
            enable_elastic_disk: false
            spark_conf:
              spark.databricks.delta.preview.enabled: "true"
              spark.databricks.delta.optimizeWrite.enabled: "true"
              spark.databricks.delta.autoCompact.enabled: "true"

      git_source:
        git_url: "https://github.com/scudellerlemos/pipeline-databricks-magic_card_game"
        git_provider: "gitHub"
        git_branch: "main"

      tags:
        project: "MTG"
        environment: "production"
        team: "data-engineering"
        api_source: "scryfall"
        layer: "silver-gold"
