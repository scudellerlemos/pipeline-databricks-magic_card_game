resources:
  jobs:
    MTG_STAGE:
      name: MTG_STAGE
      description: "Camada Stage - ingestao da API Scryfall para S3/Parquet"
      # Sem depends_on entre as tasks: rodavam em 3 pares so pra throttling de
      # concorrencia (o cluster de 1 worker fixo deu OOM com as 6 em paralelo).
      # Com autoscale no cluster (ver job_clusters abaixo) as 6 rodam direto em
      # paralelo, sem dependencia de dado entre elas.
      tasks:
        - task_key: stage_precos
          notebook_task:
            notebook_path: src/01 - Ingestion/card_prices
            source: GIT
          job_cluster_key: Job_cluster

        - task_key: stage_cartas
          notebook_task:
            notebook_path: src/01 - Ingestion/cards
            source: GIT
          job_cluster_key: Job_cluster

        - task_key: stage_regras
          notebook_task:
            notebook_path: src/01 - Ingestion/rulings
            source: GIT
          job_cluster_key: Job_cluster

        - task_key: stage_colecao
          notebook_task:
            notebook_path: src/01 - Ingestion/sets
            source: GIT
          job_cluster_key: Job_cluster

        - task_key: stage_simbologia
          notebook_task:
            notebook_path: src/01 - Ingestion/symbology
            source: GIT
          job_cluster_key: Job_cluster

        - task_key: stage_migracoes
          notebook_task:
            notebook_path: src/01 - Ingestion/migrations
            source: GIT
          job_cluster_key: Job_cluster

      job_clusters:
        - job_cluster_key: Job_cluster
          new_cluster:
            spark_version: "14.3.x-scala2.12"
            node_type_id: "m5d.large"
            # Autoscale em vez de num_workers fixo e do depends_on em pares
            # que existia so pra throttling. 3 tasks em paralelo already
            # rodavam ok num worker so (foi so com as 6 juntas que deu OOM) -
            # 1->2 workers da a mesma folga proporcional pras 6 rodando direto,
            # mantendo o custo de 1 worker fora do pico. A confirmar no teste
            # de amanha; se ainda estourar memoria, subir max_workers antes de
            # voltar a depender de depends_on manual.
            autoscale:
              min_workers: 1
              max_workers: 2
            aws_attributes:
              first_on_demand: 1
              zone_id: "us-west-1a"
              spot_bid_price_percent: 100
            spark_env_vars:
              PYSPARK_PYTHON: "/databricks/python3/bin/python3"
            enable_elastic_disk: false
            spark_conf:
              spark.databricks.delta.preview.enabled: "true"
              spark.databricks.delta.optimizeWrite.enabled: "true"
              spark.databricks.delta.autoCompact.enabled: "true"

      git_source:
        git_url: "https://github.com/scudellerlemos/pipeline-databricks-magic_card_game"
        git_provider: "gitHub"
        git_branch: "main"

      tags:
        project: "MTG"
        environment: "production"
        team: "data-engineering"
        api_source: "scryfall"
        layer: "stage"
