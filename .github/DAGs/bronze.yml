resources:
  jobs:
    MTG_BRONZE:
      name: MTG_BRONZE
      description: "Camada Bronze - EL puro da Stage (S3/Parquet) para Delta"
      # Sem depends_on entre as tasks: a ordem "so comeca depois que a Stage
      # inteira terminou" e garantida pelo job MTG_PIPELINE (run_job_task),
      # nao por dependencia dentro deste job.
      tasks:
        - task_key: bronze_cartas
          notebook_task:
            notebook_path: src/02 - Bronze/Dev/cards
            source: GIT
          job_cluster_key: Job_cluster

        - task_key: bronze_colecao
          notebook_task:
            notebook_path: src/02 - Bronze/Dev/sets
            source: GIT
          job_cluster_key: Job_cluster

        - task_key: bronze_precos
          notebook_task:
            notebook_path: src/02 - Bronze/Dev/card_prices
            source: GIT
          job_cluster_key: Job_cluster

        - task_key: bronze_simbologia
          notebook_task:
            notebook_path: src/02 - Bronze/Dev/symbology
            source: GIT
          job_cluster_key: Job_cluster

        - task_key: bronze_regras
          notebook_task:
            notebook_path: src/02 - Bronze/Dev/rulings
            source: GIT
          job_cluster_key: Job_cluster

        - task_key: bronze_migracoes
          notebook_task:
            notebook_path: src/02 - Bronze/Dev/migrations
            source: GIT
          job_cluster_key: Job_cluster

      job_clusters:
        - job_cluster_key: Job_cluster
          new_cluster:
            spark_version: "14.3.x-scala2.12"
            node_type_id: "m5d.large"
            # Autoscale (nao num_workers fixo): as 6 tasks rodam em paralelo
            # sem depends_on entre elas (ver comentario acima), diferente da
            # Stage que precisou de depends_on em pares por OOM num cluster
            # de 1 worker so. Bronze e mais leve (sem chamada de API, so
            # Parquet->Delta append) - autoscale 1->2 da folga pro pico de
            # concorrencia das 6 tasks sem manter o custo de 2 workers o
            # tempo todo nem exigir throttling manual no yml.
            autoscale:
              min_workers: 1
              max_workers: 2
            aws_attributes:
              first_on_demand: 1
              zone_id: "us-west-1a"
              spot_bid_price_percent: 100
            spark_env_vars:
              PYSPARK_PYTHON: "/databricks/python3/bin/python3"
            enable_elastic_disk: false
            spark_conf:
              spark.databricks.delta.preview.enabled: "true"
              spark.databricks.delta.optimizeWrite.enabled: "true"
              spark.databricks.delta.autoCompact.enabled: "true"

      git_source:
        git_url: "https://github.com/scudellerlemos/pipeline-databricks-magic_card_game"
        git_provider: "gitHub"
        git_branch: "main"

      tags:
        project: "MTG"
        environment: "production"
        team: "data-engineering"
        api_source: "scryfall"
        layer: "bronze"
