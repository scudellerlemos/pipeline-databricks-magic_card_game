resources:
  jobs:
    MTG_PIPELINE:
      name: MTG_PIPELINE
      description: "Pipeline de dados da API de Magic: The Gathering"
      schedule:
        # Executa diariamente às 6h
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: America/Sao_Paulo
        pause_status: UNPAUSED
      tasks:
        # ============================================================================
        # INGESTÃO - STAGING
        # ============================================================================
        - task_key: stage_cartas
          notebook_task:
            notebook_path: src/01 - Ingestion/cards
            source: GIT
          job_cluster_key: Job_cluster

        - task_key: stage_colecao
          notebook_task:
            notebook_path: src/01 - Ingestion/sets
            source: GIT
          job_cluster_key: Job_cluster

        - task_key: stage_precos
          notebook_task:
            notebook_path: src/01 - Ingestion/card_prices
            source: GIT
          job_cluster_key: Job_cluster

        - task_key: stage_simbologia
          notebook_task:
            notebook_path: src/01 - Ingestion/symbology
            source: GIT
          job_cluster_key: Job_cluster

        - task_key: stage_regras
          notebook_task:
            notebook_path: src/01 - Ingestion/rulings
            source: GIT
          job_cluster_key: Job_cluster

        - task_key: stage_migracoes
          notebook_task:
            notebook_path: src/01 - Ingestion/migrations
            source: GIT
          job_cluster_key: Job_cluster

        # ============================================================================
        # BRONZE LAYER
        # ============================================================================
        - task_key: bronze_cartas
          depends_on:
            - task_key: stage_cartas
          notebook_task:
            notebook_path: src/02 - Bronze/Dev/cards
            source: GIT
          job_cluster_key: Job_cluster

        - task_key: bronze_colecao
          depends_on:
            - task_key: stage_colecao
          notebook_task:
            notebook_path: src/02 - Bronze/Dev/sets
            source: GIT
          job_cluster_key: Job_cluster

        - task_key: bronze_precos
          depends_on:
            - task_key: stage_precos
          notebook_task:
            notebook_path: src/02 - Bronze/Dev/card_prices
            source: GIT
          job_cluster_key: Job_cluster

        - task_key: bronze_simbologia
          depends_on:
            - task_key: stage_simbologia
          notebook_task:
            notebook_path: src/02 - Bronze/Dev/symbology
            source: GIT
          job_cluster_key: Job_cluster

        - task_key: bronze_regras
          depends_on:
            - task_key: stage_regras
          notebook_task:
            notebook_path: src/02 - Bronze/Dev/rulings
            source: GIT
          job_cluster_key: Job_cluster

        - task_key: bronze_migracoes
          depends_on:
            - task_key: stage_migracoes
          notebook_task:
            notebook_path: src/02 - Bronze/Dev/migrations
            source: GIT
          job_cluster_key: Job_cluster

        # ============================================================================
        # SILVER LAYER
        # ============================================================================
        - task_key: silver_cartas
          depends_on:
            - task_key: bronze_cartas
            - task_key: bronze_precos
          notebook_task:
            notebook_path: src/03 - Silver/Dev/TB_FATO_SILVER_CARDS
            source: GIT
          job_cluster_key: Job_cluster

        - task_key: silver_colecao
          depends_on:
            - task_key: bronze_colecao
          notebook_task:
            notebook_path: src/03 - Silver/Dev/TB_REF_SILVER_SETS
            source: GIT
          job_cluster_key: Job_cluster

        # ============================================================================
        # GOLD LAYER
        # ============================================================================
        - task_key: gold_mercado_executivo
          depends_on:
            - task_key: silver_cartas
          notebook_task:
            notebook_path: src/04 - Gold/Dev/TB_ANALISE_MERCADO_CARTAS_EXECUTIVO
            source: GIT
          job_cluster_key: Job_cluster

        - task_key: gold_metricas_investimentos
          depends_on:
            - task_key: silver_cartas
          notebook_task:
            notebook_path: src/04 - Gold/Dev/TB_METRICAS_PERFORMANCE_INVESTIMENTOS
            source: GIT
          job_cluster_key: Job_cluster

        - task_key: gold_relatorio_executivo
          depends_on:
            - task_key: silver_cartas
          notebook_task:
            notebook_path: src/04 - Gold/Dev/TB_REPORT_ALERTAS_EXECUTIVOS
            source: GIT
          job_cluster_key: Job_cluster
          
      # ============================================================================
      # CLUSTER CONFIGURATION
      # ============================================================================
      job_clusters:
        - job_cluster_key: Job_cluster
          new_cluster:
            spark_version: "14.3.x-scala2.12"
            node_type_id: "m5d.large"
            num_workers: 1
            aws_attributes:
              first_on_demand: 1
              zone_id: "us-west-1a"
              spot_bid_price_percent: 100
            spark_env_vars:
              PYSPARK_PYTHON: "/databricks/python3/bin/python3"
            enable_elastic_disk: false
            spark_conf:
              spark.databricks.delta.preview.enabled: "true"
              spark.databricks.delta.optimizeWrite.enabled: "true"
              spark.databricks.delta.autoCompact.enabled: "true"
              
      # ============================================================================
      # GIT CONFIGURATION
      # ============================================================================
      git_source:
        git_url: "https://github.com/scudellerlemos/pipeline-databricks-magic_card_game"
        git_provider: "gitHub"
        git_branch: "main"
        
      # ============================================================================
      # TAGS AND METADATA
      # ============================================================================
      tags:
        project: "MTG"
        environment: "production"
        team: "data-engineering"
        api_source: "scryfall"
        
      # ============================================================================
      # QUEUE CONFIGURATION
      # ============================================================================
      # queue:
      #   enabled: true 